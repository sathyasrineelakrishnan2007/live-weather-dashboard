
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>☀️ Weather Dashboard</h1>
            <p>Check current weather and a 5-day forecast</p>
        </header>

        <form id="searchForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="currentWeather" class="weather-card" hidden>
            <h2 id="cityName"></h2>
            <div id="weatherIcon" class="weather-icon"></div>
            <h3 id="temperature"></h3>
            <p id="description"></p>

            <div class="details">
                <div>
                    <span>Feels Like</span>
                    <strong id="feelsLike"></strong>
                </div>
                <div>
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div>
                    <span>Wind Speed</span>
                    <strong id="wind"></strong>
                </div>
            </div>
        </section>

        <section id="forecastSection" hidden>
            <h2>5-Day Forecast</h2>
            <div id="forecast" class="forecast-grid"></div>
        </section>

        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
